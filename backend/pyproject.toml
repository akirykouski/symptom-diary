[project]
name = "symptom-diary-backend"
version = "0.1.0"
description = "Local encrypted symptom diary backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # On Windows: prebuilt wheel from sqlcipher3-wheels.
    # On macOS/Linux: source build of sqlcipher3, requires system SQLCipher
    #   (e.g. `brew install sqlcipher` or `apt install libsqlcipher-dev`).
    "sqlcipher3-wheels>=0.5.4; sys_platform == 'win32'",
    "sqlcipher3>=0.5.4; sys_platform != 'win32'",
    "argon2-cffi>=23.1.0",
    "pydantic>=2.9.0",
    "python-multipart>=0.0.12",
    "itsdangerous>=2.2.0",
    "httpx>=0.27.0",
    "numpy>=2.0.0",
    "sqlite-vec>=0.1.6",
    "pillow>=10.4.0",
    "pynacl>=1.5.0",
    "python-dateutil>=2.9.0",
    "segno>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
]
# WeasyPrint renders the clinician brief to a real PDF. It pulls in
# Pango/Cairo/HarfBuzz, which is a heavy install on Windows — so it's
# optional. Without it, the /api/insights/brief.pdf endpoint falls back
# to an attachment-disposition HTML download (still browser-printable).
pdf = [
    "weasyprint>=62.0",
]
# Runs the Clario LoRA extractor sidecar locally (scripts/clario_extractor_service.py).
# Pulls transformers + peft + bitsandbytes + torch (~3 GB on disk, requires a
# CUDA GPU with ~6 GB free VRAM). Without it, the backend's extraction worker
# falls back to vanilla Gemma via Ollama. Adapter weights are pulled from
# huggingface.co/m0rtyddd/clario-gemma4-e4b-lora-v2 on first run.
extractor = [
    "transformers>=4.45.0",
    "peft>=0.13.0",
    "bitsandbytes>=0.44.0",
    "accelerate>=1.0.0",
    "torch>=2.5.0",
    "huggingface_hub>=0.26.0",
    "pronto>=2.5.0",
    "lxml>=5.0.0",
    "tqdm>=4.66.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["diary"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
